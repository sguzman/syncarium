name: Rust CI

# Superseded branch commits need not consume scarce CI runners.
# Keep only the newest push/PR run for each ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format source for build validation
        run: cargo fmt --all
      - name: Syntax-check first live sync helper (no live execution)
        run: bash -n scripts/first-live-sync.sh
      - name: Install rclone for offline local-backend integration test
        run: |
          if ! command -v rclone >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y rclone
          fi
      - name: Compile and test
        run: cargo test --all-targets
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
