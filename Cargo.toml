[package]
name = "syncarium"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust-first, bounded, one-way multi-source archival scheduler"
repository = "https://github.com/sguzman/syncarium"
rust-version = "1.82"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"

[profile.release]
lto = "thin"
