# Copy to ~/.config/syncarium/config.toml and edit locally.
# Everything is OFF until you explicitly set enabled=true per source
# AND enable the systemd timer or run with --execute.
archive_root = "/drive"
required_mount = "/drive"

[scheduler]
budget_mib = 128
chunk_mib = 8
bandwidth_kib = 512
run_seconds = 900

[[sources]]
name = "google-drive"
kind = "rclone"
enabled = false
remote = "gdrive:"
destination = "/drive/gdrive"

[[sources]]
name = "icloud-drive"
kind = "rclone"
enabled = false
remote = "icloud:"
destination = "/drive/icloud/drive"

[[sources]]
name = "icloud-photos"
kind = "rclone"
enabled = false
# Optional after confirming a baseline with read-only plan:
# min_items = 10000
# Optional after measuring a stable library size (count is not proof of coverage):
# min_total_bytes = 50000000000
# Optional STRICT mode: hold this source if any previously observed cloud path
# vanishes, including intentional deletions/renames. Disabled by default:
# require_historical_coverage = true
remote = "icloudphotos:PrimarySync/All Photos"
destination = "/drive/icloud/photos/primary"

# Example non-rclone source:
# [[sources]]
# name = "example-http"
# kind = "http_manifest"
# enabled = false
# manifest = "/home/USERNAME/.config/syncarium/http-manifest.json"
# destination = "/drive/other-service"

# Optional native Rust ID-addressed recovery of Google Drive duplicate files.
# INACTIVE until enabled explicitly, and it requires a private, short-lived
# Google OAuth bearer access token file with chmod 600.
# This is a distinct, non-overlapping destination tree from the normal backup.
# The same global run budget applies.
#
# [[sources]]
# name = "google-drive-ids"
# kind = "google_drive_ids"
# enabled = false
# remote = "gdrive:"
# token_file = "/home/YOUR_USER/.config/syncarium/google-access-token"
# destination = "/drive/gdrive-immutable-ids"

# Destination paths are not allowed to nest beneath another source's
# destination, even when that other source is disabled. This prevents accidental
# overlap and preserves append-only archive safety.

# EXPERIMENTAL Google Workspace single-shot exports (Docs/Sheets/Slides/Drawings).
# All authentication is MANUAL. Do NOT enable for unattended hourly syncing.
# Use an entirely separate, nonnested archive destination.
# Unversioned or over-budget exports are explicitly held for review.
#
# [[sources]]
# name = "google-workspace"
# kind = "google_workspace"
# enabled = false
# remote = "gdrive:"
# token_file = "/home/YOUR_USER/.config/syncarium/google-access-token"
# destination = "/drive/gdrive-workspace"
